# Stage-one sweep, wave 2: a head that adds its own spectrum to the filtered sources, and smaller decoders. Needs ckpt/te-audio.pt, ckpt/bf-v1.pt and
# ckpt/data/{train,val}.txt in the checkout, untracked.
name: vocos-sweep2-both-phase+spec-phase-d384
setup: bash experiments/vocos/setup.sh
command: bash experiments/vocos/sweep.sh experiments/vocos/out/sweep2 60000 'both-phase={"model":{"head":"both","full_band":true},"loss":{"msmel":1,"stft":1,"phase":1,"cplx":1}}' 'spec-phase-d384={"model":{"dim":384},"loss":{"msmel":1,"stft":1,"phase":1,"cplx":1}}'
gpus: 1
priority: 20
env:
  REQUIRE_CUDA: "1"
  PYTHONUNBUFFERED: "1"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
secrets: [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY]
outputs:
  - path: experiments/vocos/out/sweep2
    s3: s3://brendanlong-experiments/kokoro-vocos/{job_id}/sweep2
estimated_runtime_min: 135
max_runtime_min: 240
