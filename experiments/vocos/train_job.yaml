# Needs ckpt/te-audio.pt, ckpt/bf-v1.pt and ckpt/data/{train,val}.txt in the checkout, untracked.
name: vocos-v1
setup: bash experiments/lstm_swap/setup.sh
command: bash experiments/vocos/run.sh experiments/vocos/out/v1 60000
gpus: 1
priority: 10
env:
  REQUIRE_CUDA: "1"
  PYTHONUNBUFFERED: "1"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
outputs:
  - path: experiments/vocos/out
estimated_runtime_min: 180
