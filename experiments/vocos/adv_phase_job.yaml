# Needs ckpt/{te-audio,bf-v1,vocos-phase}.pt and ckpt/data in the checkout, and the corpus run.sh makes.
name: vocos-adv-phase
setup: bash experiments/lstm_swap/setup.sh
command: 'bash experiments/vocos/run_adv.sh experiments/vocos/out/adv-phase ckpt/vocos-phase.pt 16000 ''{"loss": {"msmel": 1, "stft": 1, "phase": 1, "cplx": 1}}'''
gpus: 1
priority: 10
env:
  REQUIRE_CUDA: "1"
  PYTHONUNBUFFERED: "1"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
outputs:
  - path: experiments/vocos/out
estimated_runtime_min: 250
