# Stage-one sweep, wave 4: for phase. Three short spectra per frame instead of one long one, and the
# phase terms at three times the weight. Needs ckpt/te-audio.pt, ckpt/bf-v1.pt and
# ckpt/data/{train,val}.txt in the checkout, untracked.
name: vocos-sweep4-phase
setup: bash experiments/vocos/setup.sh
command: bash experiments/vocos/sweep.sh experiments/vocos/out/sweep4 60000 'both-sub3={"model":{"head":"both","full_band":true,"sub":3},"loss":{"msmel":1,"stft":1,"phase":1,"cplx":1}}' 'both-phase3={"model":{"head":"both","full_band":true},"loss":{"msmel":1,"stft":1,"phase":3,"cplx":3}}'
gpus: 1
priority: 20
env:
  REQUIRE_CUDA: "1"
  PYTHONUNBUFFERED: "1"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
secrets: [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY]
outputs:
  - path: experiments/vocos/out/sweep4
    s3: s3://brendanlong-experiments/kokoro-vocos/{job_id}/sweep4
estimated_runtime_min: 165
max_runtime_min: 240
