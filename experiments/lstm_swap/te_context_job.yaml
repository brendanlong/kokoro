# Needs ckpt/v1.pt (the v1 students) and ckpt/data/{train,val}.txt (prep_data.py's output) in the checkout, untracked.
name: lstm-swap-te-context
setup: bash experiments/lstm_swap/setup.sh
command: 'bash experiments/lstm_swap/run_te.sh experiments/lstm_swap/out/te-context tenc 8000 ''{"n_blocks": 4}'''
gpus: 1
priority: 10
env:
  REQUIRE_CUDA: "1"
  PYTHONUNBUFFERED: "1"
outputs:
  - path: experiments/lstm_swap/out
estimated_runtime_min: 45
